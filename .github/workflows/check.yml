name: Check booking status

on:
  schedule:
    # GitHub's minimum schedule granularity is 5 minutes, and actual runs
    # can lag a few extra minutes under load — treat this as "every 5-10 min",
    # not a hard real-time guarantee.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python check.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}

      - name: Commit updated state
        run: |
          git config user.name "bookquick-bot"
          git config user.email "bookquick-bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update state.json [skip ci]"
          git push
